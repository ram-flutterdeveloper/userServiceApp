name: user_servicehub
description: "ServiceHub - Premium Multi-Service Marketplace"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^14.8.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  lottie: ^3.3.1
  intl: ^0.19.0
  smooth_page_indicator: ^1.2.0+3
  shared_preferences: ^2.3.5
  dio:
  pretty_dio_logger: any
  # State management
  provider: ^6.1.5
  google_fonts: ^6.2.1
  gap: 
  flutter_screenutil:
  loader_overlay:
  get:
  # Functional programming
  fpdart: any
  

  # DI
  get_it: any
  url_launcher:

  # Location
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  google_places_flutter: ^2.0.9
  http: ^1.2.2
  image_picker: ^1.1.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
